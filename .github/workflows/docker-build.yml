name: Build and Push Multi-Arch Image

on:
  workflow_dispatch: {}   # 不声明 inputs，触发时不会有任何表单，直接点确认

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 从 build.sh 读取默认变量
        id: vars
        run: |
          source <(grep '^DEFAULT_' build.sh)
          echo "version=$DEFAULT_VERSION" >> "$GITHUB_OUTPUT"
          echo "repo=$DEFAULT_REPO" >> "$GITHUB_OUTPUT"
          echo "src_url=$DEFAULT_URL" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
            SOURCE_URL=${{ steps.vars.outputs.src_url }}
          tags: |
            ${{ steps.vars.outputs.repo }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.repo }}:latest
