user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # 与 php.ini 的 post_max_size(72M) 保持一致，避免 nginx 先于 PHP 截断上传
    client_max_body_size 72M;
    client_body_buffer_size 512k;
    client_body_temp_path /var/www/html/runtime/temp/nginx_upload 1 2;

    # 反代场景下拿到真实协议，避免后台资源被强制跳 http
    map $http_x_forwarded_proto $forwarded_scheme {
        default $scheme;
        https   https;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    upstream php-fpm {
        server unix:/run/php-fpm.sock;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php index.html;
        charset utf-8;

        # 健康检查：不经过 PHP，避免数据库异常时容器被判定为 unhealthy
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # 隐藏文件 / 敏感路径
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
        }

        # 上传目录：只作为静态资源提供，禁止执行任何脚本（防止木马上传后被执行）
        location ^~ /storage/ {
            location ~* \.(php|phar|phtml|php\d|pl|py|jsp|asp|sh|cgi)$ {
                deny all;
            }
            expires 7d;
            add_header Cache-Control "public";
            try_files $uri =404;
        }

        # 前端构建产物：长缓存
        location ~* ^/(admin|index)/static/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
            try_files $uri =404;
        }

        location ~* ^/static/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
            try_files $uri =404;
        }

        # ThinkPHP 伪静态：文件不存在时交给入口文件
        # 必须通过 ?s= 传递原始路径，否则 ThinkPHP 取不到 pathinfo，
        # 所有 /admin/xxx 接口都会被当成首页路由。
        location / {
            try_files $uri $uri/ /index.php?s=$uri&$args;
        }

        location ~ ^(.+\.php)(/.*)?$ {
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            try_files $fastcgi_script_name =404;

            fastcgi_pass php-fpm;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO       $fastcgi_path_info;
            fastcgi_param HTTPS           $https if_not_empty;
            fastcgi_param REQUEST_SCHEME  $forwarded_scheme;

            fastcgi_connect_timeout 60s;
            fastcgi_send_timeout 300s;
            fastcgi_read_timeout 300s;
            fastcgi_buffer_size 64k;
            fastcgi_buffers 8 64k;
            fastcgi_busy_buffers_size 128k;
            fastcgi_temp_file_write_size 128k;
            fastcgi_request_buffering off;
        }
    }
}
