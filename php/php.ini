; 粒子导航 PHP 运行时配置
; 默认 php.ini 未启用时，PHP 使用内置默认值（upload_max_filesize=2M / post_max_size=8M），
; 后台上传 5M 图片、50M 视频会被静默截断，这里统一放开。

expose_php = Off
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; 附件上传上限需大于应用内最大限制（视频 50M）
file_uploads = On
upload_max_filesize = 64M
post_max_size = 72M
max_file_uploads = 30

date.timezone = Asia/Shanghai
default_charset = UTF-8

; 错误处理：容器内输出到日志，不回显到页面
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; 会话
session.save_path = /var/www/html/runtime/session
session.gc_maxlifetime = 86400
session.cookie_httponly = 1

; opcache（源码不变，长期缓存）
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
