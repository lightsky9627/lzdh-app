; 粒子导航 PHP-FPM 池配置（覆盖默认 www.conf 中的同名项）
[www]
user = www-data
group = www-data

; 使用 unix socket，比 TCP 更快，且启动就绪判断更可靠
listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; 继承容器环境变量（DB_HOST/DB_USER 等需要传给 ThinkPHP 的 env()）
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; 上传临时目录放在 runtime 下，避免 /tmp 权限问题
php_admin_value[upload_tmp_dir] = /var/www/html/runtime/temp
php_admin_value[sys_temp_dir] = /var/www/html/runtime/temp

; 日志
php_admin_value[error_log] = /var/log/php/php-error.log
php_admin_flag[log_errors] = on
catch_workers_output = yes
decorate_workers_output = no
